<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #09122C;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 2rem;
            color: #ffffff;
        }

        body {
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
        }

        h1,
        .container {
            position: relative;
            top: -2rem;
        }

        .container {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            padding: 3rem;
            text-align: center;
            background-color: #FFF6DA;
            border-radius: 6px;
            opacity: 1;
            transform: scale(1);
        }

        .container.hidden {
            opacity: 0;
            transform: scale(0.95);
        }

        #result {
            font-size: 24px;
            margin-top: 20px;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            color: #09122C;
            text-align: center;
            font-weight: bolder;
            font-size: xx-large;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid #09122C;
            border-radius: 9px;
            background-color: F5F5F5;
            color: #09122C;
            font-weight: bolder;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: moveStar 5s linear infinite;
        }

        .loveheart {
            position: absolute;
            top: 2rem;
            left: 1rem;
            rotate:-30deg;
            font-size: xx-large;
        }

        @keyframes moveStar {
            0% {
                transform: translateY(0) translateX(0);
            }

            100% {
                transform: translateY(100vh) translateX(100vw);
            }
        }
    </style>
</head>

<body>
    <h1>今天吃什么？🌞</h1>
    <div class="container" id="container">
        <div class="loveheart">❤️</div>
        <p id="result">点击下方按钮开始</p>
        <button id="startbtn" onclick="pickFood()">让曾皓阳帮我决定！</button>
    </div>

        function pickFood() {
            const randomIndex = Math.floor(Math.random() * foodlist.length);
            const finalFood = foodlist[randomIndex];
            pText.style.opacity = 0;
            setTimeout(() => {
                pText.innerHTML = `让本小皇帝帮你想想！(*^▽^*)`;
                pText.style.opacity = 1;
            }, 500);
            setTimeout(() => {
                pText.style.opacity = 0;
                setTimeout(() => {
                    pText.innerHTML = `吃什么呢？(O_o)??`;
                    pText.style.opacity = 1;
                }, 500);
            }, 1000);
            setTimeout(() => {
                pText.style.opacity = 0;
                setTimeout(() => {

                    pText.style.opacity = 1;
                }, 500);
            }, 1500);

                setTimeout(() => {

                }, 500);
            }, 2000);
            setTimeout(() => {
                pText.style.opacity = 0;
                setTimeout(() => {
                    pText.innerHTML = `${finalFood}`;
                    pText.style.opacity = 1;
                }, 500);
            }, 2500);
            startbtn.innerHTML = restart();
        }

        function restart() {
            return `不满意！我要再选一次！`;
        }

        function createStars() {
            const starCount = 100;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.top = `${Math.random() * 100}vh`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.animationDuration = `${Math.random() * 5 + 5}s`;
                document.body.appendChild(star);
            }
        }

        createStars();
    </script>
</body>

</html>
